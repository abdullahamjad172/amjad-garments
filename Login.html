
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amjad Garments - Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3eee5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #0002;
            text-align: center;
        }

        h1 {
            color: #80551b;
            font-size: 25px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #80551b;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        p {
            color: #666;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>Amjad Garments</h1>
        <p>Please login to your account</p>

        <form>
            <input type="email" placeholder="Email Address" required>
            <input type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <p>Welcome to Amjad Garments!</p>
    </div>
</body>
</html>
